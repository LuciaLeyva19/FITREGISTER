<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FITREGISTER | Crear cuenta</title>
    <link rel="stylesheet" href="login.css">
    <link rel="stylesheet" href="registro.css">
    <script src="registro.js" defer></script>
</head>
<body>
    <main class="acceso">
        <section class="acceso-formulario" aria-labelledby="titulo-registro">
            <div class="contenido-acceso">
                <p class="marca">FIT<span>REGISTER</span></p>

                <h1 id="titulo-registro">Crear cuenta</h1>
                <p class="texto-secundario">Crea tu perfil de entrenador en FITREGISTER.</p>

                <form id="form-registro" method="post">
                    <div class="campo">
                        <label for="nombre">Nombre completo</label>
                        <input id="nombre" name="nombre" type="text"
                               autocomplete="name" maxlength="80" required>
                    </div>

                    <div class="campo">
                        <label for="correo-registro">Correo electrónico</label>
                        <input id="correo-registro" name="correo" type="email"
                               autocomplete="email" required>
                    </div>

                    <div class="campo">
                        <label for="contrasena-registro">Contraseña</label>
                        <input id="contrasena-registro" name="contrasena"
                               type="password" autocomplete="new-password"
                               minlength="8" aria-describedby="ayuda-contrasena" required>
                        <small id="ayuda-contrasena" class="texto-secundario">
                            Usa al menos 8 caracteres.
                        </small>
                    </div>

                    <div class="campo">
                        <label for="confirmar-contrasena">Confirmar contraseña</label>
                        <input id="confirmar-contrasena" name="confirmacion"
                               type="password" autocomplete="new-password" required>
                    </div>

                    <button class="boton-entrar" type="submit">Crear cuenta</button>
                    <p id="mensaje-registro" role="status"></p>
                </form>

                <p class="enlace-acceso">
                    ¿Ya tienes cuenta? <a href="login.html">Iniciar sesión</a>
                </p>
                <p class="texto-secundario nota-registro">
                    Registro de prueba. Usa datos ficticios.
                </p>
            </div>
        </section>

        <div class="foto-acceso" aria-hidden="true"></div>
    </main>
</body>
</html>
