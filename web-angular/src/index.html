<!doctype html>
<html lang="es">

<head>
  <meta charset="utf-8">

  <title>FITREGISTER | Angular</title>

  <base href="/">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <!-- Color de FITREGISTER -->
  <meta
    name="theme-color"
    content="#10151d"
  >

  <!-- Descripción de la PWA -->
  <meta
    name="description"
    content="Gestión de clientes y planes de entrenamiento."
  >

  <!-- MANIFIESTO DE FITREGISTER -->
  <link
    rel="manifest"
    href="/manifest.webmanifest"
  >

  <!-- ICONO DE FITREGISTER -->
  <link
    rel="icon"
    type="image/png"
    sizes="192x192"
    href="/assets/img/iconos/icon-192.png"
  >

  <!-- ICONO PARA DISPOSITIVOS APPLE -->
  <link
    rel="apple-touch-icon"
    href="/assets/img/iconos/icon-192.png"
  >

</head>

<body>
  <app-root></app-root>
</body>

</html>
